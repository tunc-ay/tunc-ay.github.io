# Site settings
title: Tuncay Kayaoglu
name: Tuncay Kayaoglu
email: tuncaykayaoglu@yahoo.com
description: >-
  Lead technical writer specializing in software documentation, API documentation,
  and user guides. Clear, concise, and user-friendly documentation for complex products.
url: "https://tunc-ay.github.io"
baseurl: ""
locale: en-US
repository: tunc-ay/tunc-ay.github.io

# Theme
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: air
search: true
breadcrumbs: false

# Author sidebar
author:
  name: Tuncay Kayaoglu
  avatar: /assets/images/profile.jpg
  bio: Lead Technical Writer. I turn complex software and hardware into clear, usable documentation.
  links:
    - label: Email
      icon: fas fa-fw fa-envelope-square
      url: mailto:tuncaykayaoglu@yahoo.com
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/tuncaykayaoglu
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/tunc-ay

footer:
  links:
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/tuncaykayaoglu
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/tunc-ay

# Content
include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# SEO
social:
  name: Tuncay Kayaoglu
  links:
    - https://www.linkedin.com/in/tuncaykayaoglu
    - https://github.com/tunc-ay

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - .vscode
  - .sass-cache/
  - .jekyll-cache/
