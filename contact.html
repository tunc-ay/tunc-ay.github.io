<style>
    .contact-container {
        max-width: 600px;
    }
    #contact-form {
        display: flex;
        flex-direction: column;
    }
    #contact-form input,
    #contact-form textarea {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        font-family: inherit;
    }
    #contact-form textarea {
        height: 150px;
    }
    #status-message {
        margin-top: 20px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        font-weight: bold;
    }
    #status-message.success {
        background-color: #d4edda;
        color: #155724;
    }
    #status-message.error {
        background-color: #f8d7da;
        color: #721c24;
    }
    #status-message.hidden {
        display: none;
    }
</style>

<div class="contact-container">
    <p>Have a question or a documentation project in mind? Send me a message.</p>
    <form id="contact-form">
        <input type="text" name="name" placeholder="Your Name" aria-label="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" aria-label="Your Email" required>
        <textarea name="message" placeholder="Your Message" aria-label="Your Message" required></textarea>
        <button type="submit" class="btn btn--primary btn--large">Send</button>
    </form>
    <div id="status-message" class="hidden" role="status"></div>
</div>

<script>
    const form = document.getElementById('contact-form');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', handleSubmit);

    async function handleSubmit(event) {
        event.preventDefault();
        const formData = new FormData(form);

        // Disable the submit button and show "Sending..." text
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = 'Sending...';

        try {
            const response = await fetch('https://formspree.io/f/mbljjkyv', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });
            if (response.ok) {
                showStatus('Thanks for your message!', 'success');
                form.reset();
            } else {
                showStatus('Oops! There was a problem submitting your message', 'error');
            }
        } catch (error) {
            showStatus('Oops! There was a problem submitting your message', 'error');
        } finally {
            // Re-enable the submit button and restore original text
            submitButton.disabled = false;
            submitButton.textContent = originalButtonText;
        }
    }

    function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = type;

        // Hide the status message after 5 seconds
        setTimeout(() => {
            statusMessage.className = 'hidden';
        }, 5000);
    }
</script>
